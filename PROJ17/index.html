<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragraph Generator</title>
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
    }

    body{
        background:linear-gradient(135deg,#74ebd5,#ACB6E5);
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
    }

    #main{
        width:700px;
        background:#fff;
        padding:30px;
        border-radius:10px;
        box-shadow:0 5px 15px rgba(0,0,0,0.2);
    }
    h1{
        text-align:center;
        color:#007bff;
        margin-bottom:25px;
    }

    .row{
        display:flex;
        align-items:center;
        gap:20px;
        margin-bottom:25px;
    }

    .row div:first-child{
        font-size:20px;
        font-weight:bold;
    }

    input{
        width:80px;
        padding:8px;
        font-size:18px;
        text-align:center;
        border:2px solid #ccc;
        border-radius:5px;
        outline:none;
    }

    input:focus{
        border-color:#007bff;
    }

    button{
        padding:10px 20px;
        font-size:16px;
        border:none;
        border-radius:5px;
        background:#007bff;
        color:#fff;
        cursor:pointer;
        transition:.3s;
    }

    button:hover{
        background:#0056b3;
         transform:scale(1.05);
    }
    button:active{
        transform:scale(.95);
    }

    #data{
        margin-top:20px;
         max-height:400px;
    overflow-y:auto;
    }

    #data p{
        font-size:17px;
        line-height:1.8;
        margin-bottom:18px;
        text-align:justify;
        padding:12px;
        background:#f8f9fa;
        border-left:5px solid #007bff;
        border-radius:5px;
    }
</style>
<body>
    
     <div id="main">
        <h1>Random Paragraph Generator</h1>
        <div class="row">
            <div>
                Paragraph:
            </div>
            <div>
                <input type="number" value="5" id="item">
            </div>
            <div>
              <button onclick="generate()">Generate</button>  
            </div>
        </div>
        <div class="row" style="display: block;" id="data">
        </div>
     </div>
</body>
<script>
     const text = [
            "Web development is the process of building websites and web applications that users can access through the internet. It combines HTML for creating the structure, CSS for designing attractive layouts, and JavaScript for adding dynamic functionality. Modern web developers also work with frameworks, APIs, databases, and cloud services to create fast, secure, and user-friendly applications that run smoothly on different devices and browsers.",

            "JavaScript is one of the most powerful programming languages used in front-end and back-end development. It allows developers to build interactive websites by responding to user actions such as button clicks, keyboard input, scrolling, and animations. With technologies like Node.js, JavaScript can also be used to develop server-side applications, making it a versatile language for full-stack development.",

            "Learning programming is a journey that requires consistency, patience, and regular practice. Beginners often start with simple concepts such as variables, loops, and functions before moving on to object-oriented programming and data structures. Solving coding challenges and building real-world projects not only improves logical thinking but also helps developers gain practical experience that is highly valued in the software industry.",

            "Git and GitHub have become essential tools for software developers around the world. Git helps track changes in source code, making it easy to restore previous versions whenever needed. GitHub provides an online platform where developers can store repositories, collaborate with teams, review code through pull requests, and contribute to open-source projects. These tools make software development more organized and efficient.",

            "Responsive web design ensures that websites provide an excellent user experience on desktops, laptops, tablets, and smartphones. Developers use flexible layouts, CSS media queries, and responsive images so that content automatically adjusts according to screen size. A responsive website improves accessibility, enhances user satisfaction, and performs better in search engine rankings.",

            "Backend development focuses on the server side of web applications, where business logic, databases, and user authentication are managed. Technologies such as Node.js, Express.js, MySQL, MongoDB, and REST APIs enable developers to store, retrieve, and process data efficiently. A strong backend ensures that applications remain secure, scalable, and capable of handling multiple users simultaneously.",

            "Software testing plays an important role in delivering reliable and high-quality applications. Developers perform different types of testing, including unit testing, integration testing, and user acceptance testing, to identify and fix bugs before deployment. Proper testing improves application stability, enhances performance, and ensures that users receive a smooth and error-free experience.",

            "Technology continues to evolve rapidly, making continuous learning an important habit for every developer. New programming languages, frameworks, and development tools are introduced every year. Developers who stay updated with industry trends, read technical blogs, participate in coding communities, and build personal projects are more likely to succeed in their careers and adapt to changing technologies.",

            "Building real-world projects is one of the best ways to strengthen programming skills. Projects such as weather applications, to-do lists, portfolio websites, e-commerce platforms, and blog systems help developers understand how different technologies work together. Working on practical applications improves debugging skills, boosts confidence, and creates an impressive portfolio that can attract recruiters and increase job opportunities."
            ];
    function shuffle(array) {
    let currentIndex = array.length;

    // While there remain elements to shuffle...
    while (currentIndex != 0) {

        // Pick a remaining element...
        let randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;

        // And swap it with the current element.
        [array[currentIndex], array[randomIndex]] = [
        array[randomIndex], array[currentIndex]];
    }
    return array;
}
    const item=document.querySelector("#item");
    const datacont=document.querySelector("#data");
    //js array random sort
    const generate=()=>{
        if(isNaN(item.value)|| item.value <0|| item.value >9){
            const randomIndex=Math.floor(Math.random()*text.length)
            datacont.innerHTML=`<p>${text[randomIndex]}</p>`
        }else{
           const localtext=shuffle([...text]);
           const data= localtext.slice(0,Number(item.value));
           const para=data.map(
           (d)=>{
             return `<p> ${d} </p>`;
           });
              datacont.innerHTML = para.join("");
        }
        
    } 
</script>
</html>
