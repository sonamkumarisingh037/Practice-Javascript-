<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         *{
                margin:0;
                padding:0;
                box-sizing:border-box;
                font-family:Arial, Helvetica, sans-serif;
            }

            body{
                background:#f2f2f2;
            }

            main{
                width:60%;
                height:500px;
                margin:80px auto 20px;
                position:relative;
                overflow:hidden;
                border-radius:15px;
                box-shadow:0 10px 25px rgba(0,0,0,0.3);
            }

            .slide{
                width:100%;
                height:100%;
                position:absolute;
                object-fit:cover;
                transition:transform 0.8s ease;
            }

            .nav{
                text-align:center;
                margin-top:20px;
            }

            .nav button{
                padding:10px 25px;
                font-size:18px;
                border:none;
                border-radius:8px;
                background:#007bff;
                color:white;
                cursor:pointer;
                margin:0 10px;
                transition:0.3s;
            }

            .nav button:hover{
                background:#0056b3;
                transform:scale(1.05);
            }

            .nav button:active{
                transform:scale(0.95);
            }
    </style>
</head>
<body>
        <main>
            <img src="https://picsum.photos/id/236/1000/500" class="slide" alt="">
            <img src="https://picsum.photos/id/237/1000/500" class="slide" alt="">
            <img src="https://picsum.photos/id/238/1000/500" class="slide" alt="">
            <img src="https://picsum.photos/id/239/1000/500" class="slide" alt="">
        </main>
        <div class="nav">
            <button onclick="goPrev()">Previous</button>
            <button onclick="goNext()">Next</button>
        </div>
    
</body>
<script>
    const slides=document.querySelectorAll(".slide");
    let counter =0;
    slides.forEach((slide,index)=>{
         slide.style.left=`${index*100}%`
    })
    const goPrev=()=>{
         if (counter > 0) {
            counter--;
            slideImage();
       }
    }
    const goNext=()=>{
        if (counter < slides.length - 1) {
            counter++;
            slideImage();
      }
    }
   const slideImage=()=>{
    slides.forEach((slide)=>{
        slide.style.transform=`translateX(-${counter*100}%)`
    })
   }
</script>
</html>
